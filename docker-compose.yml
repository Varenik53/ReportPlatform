services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: report_platform
      POSTGRES_USER: report_platform
      POSTGRES_PASSWORD: report_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report_platform -d report_platform"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgres://report_platform:report_platform@postgres:5432/report_platform
      STORAGE_DIR: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - report-storage:/app/storage

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://report_platform:report_platform@postgres:5432/report_platform
      STORAGE_DIR: /app/storage
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 60s
    volumes:
      - report-storage:/app/storage

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    depends_on:
      - api
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: e2e/Dockerfile
    environment:
      PLAYWRIGHT_BASE_URL: http://web:3000
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      worker:
        condition: service_started
      web:
        condition: service_healthy

volumes:
  postgres-data:
  report-storage:
